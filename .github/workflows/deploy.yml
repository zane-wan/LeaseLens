name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          # Write the deploy script to a temp file
          cat > /tmp/deploy.sh << 'SCRIPT_END'
          #!/bin/bash
          set -e
          export HOME=/root
          git config --global --add safe.directory /home/ec2-user/LeaseLens
          cd /home/ec2-user/LeaseLens
          git pull origin main
          chown -R ec2-user:ec2-user /home/ec2-user/LeaseLens
          SCRIPT_END

          # Append .env.local creation with actual secret values
          cat >> /tmp/deploy.sh << EOF
          cat > .env.local << 'ENVEOF'
          DATABASE_URL=${DATABASE_URL}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          AWS_ACCESS_KEY_ID=${APP_AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${APP_AWS_SECRET_ACCESS_KEY}
          AWS_S3_BUCKET=${AWS_S3_BUCKET}
          AWS_REGION=${APP_AWS_REGION}
          JWT_SECRET=${JWT_SECRET}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
          STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          EMAIL_MODE=ses
          AWS_SES_FROM_EMAIL=noreply@leaselens.website
          ENVEOF
          EOF

          # Append docker commands
          cat >> /tmp/deploy.sh << 'SCRIPT_END'
          docker compose up -d --build
          docker image prune -f
          SCRIPT_END

          # Convert script to JSON array of commands (one element = entire script)
          SCRIPT_CONTENT=$(cat /tmp/deploy.sh)
          COMMANDS_JSON=$(jq -n --arg script "$SCRIPT_CONTENT" '{"commands": [$script]}')

          # Send command to EC2 via SSM (no SSH needed)
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS_JSON" \
            --timeout-seconds 600 \
            --comment "Deploy LeaseLens from GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          # Poll until the command completes
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "::error::Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            echo "Status: $STATUS — waiting 10s... ($i/60)"
            sleep 10
          done

          echo "::error::Deployment timed out after 10 minutes"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_AWS_ACCESS_KEY_ID: ${{ secrets.APP_AWS_ACCESS_KEY_ID }}
          APP_AWS_SECRET_ACCESS_KEY: ${{ secrets.APP_AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          APP_AWS_REGION: ${{ secrets.APP_AWS_REGION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
